name: Node.js CI

on:
  push:
    branches: [ "main", "feature/express-demo" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE_NAME: 'express-demo'

jobs:
  build:
    name: build-docker-image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
      - uses: actions/checkout@v4

      - name: setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: copy env and install dependencies
        run: |
           cp env.template.txt .env
           npm --version
           node --version
           npm ci
           npm prune
      - name: Build application
        run : npm run build

      - name: set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to dockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push DockerImage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: |
           ${{ env.DOCKER_IMAGE_NAME }}:ci-${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache, mode=max


    